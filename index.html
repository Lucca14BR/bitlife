<style>

    --accent:#6c5ce7; --accent2:#0f9f78; --good:#12945f; --warn:#d4920a; --bad:#e24b5b;
    --shadow:0 12px 32px rgba(28,39,68,.08); --fab1:#6c5ce7; --fab2:#8a7cff;
  }
  html[data-theme="dark"] {
    --bg:#0e1220; --card:#171c2e; --ink:#eef2ff; --muted:#a3adc4; --line:#2c3450;
    --accent:#8b7cff; --accent2:#2ad4a8; --good:#3ddc97; --warn:#f5c451; --bad:#ff6b7d;
    --shadow:0 14px 36px rgba(0,0,0,.35); --fab1:#6d5efc; --fab2:#2ee9ff;
  }
  html[data-theme="neon"] {
    --bg:#07010f; --card:#14081f; --ink:#f7ecff; --muted:#c9b6e8; --line:#43265f;
    --accent:#ff2bd6; --accent2:#2ee9ff; --good:#3dff9a; --warn:#ffe14a; --bad:#ff3b6b;
    --shadow:0 0 28px rgba(255,43,214,.22); --fab1:#ff2bd6; --fab2:#2ee9ff;

  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family:Inter, system-ui, sans-serif; background:

      var(--bg);
    color:var(--ink);
  }
  button, input, select { font-family:inherit; color:inherit; }
  button { cursor:pointer; }
  h1,h2,h3,.display { font-family:Poppins, Inter, sans-serif; margin:0; }
  small, .muted { color:var(--muted); }
  .wrap { max-width:1180px; margin:0 auto; padding:16px 14px 108px; }
  .topwrap { position:sticky; top:0; z-index:20; padding-top:8px; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(14px); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:14px; }
  .hero { text-align:center; padding:28px 18px 18px; }
  .hero h1 { font-size:clamp(32px, 6vw, 58px); letter-spacing:-.04em; }
  .grad { background:linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .menu-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:18px; }
  .big { width:100%; border:0; border-radius:18px; padding:16px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); text-align:left; }
  .big:hover { transform:translateY(-2px); }
  .big b { display:block; font-size:18px; margin-bottom:4px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button, .btn { border:0; border-radius:999px; padding:8px 14px; font-weight:700; background:var(--accent); color:#fff; }
  .seg button { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:#fff; border-color:transparent; }
  .btn.alt { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn.good { background:var(--good); color:#04210f; }
  .btn.bad { background:var(--bad); }
  .btn.warn { background:var(--warn); color:#2a1d00; }
  .btn.tiny { padding:6px 10px; font-size:12px; }
  .btn:active { transform:translateY(1px) scale(.98); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row b { display:block; }
  .row small { display:block; line-height:1.35; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .stage { display:grid; gap:12px; margin-top:12px; }
  .scroll { max-height:calc(100dvh - 250px); overflow:auto; }
  .entry { border-radius:14px; padding:10px 12px; margin-bottom:8px; background:color-mix(in srgb, var(--line) 65%, var(--card)); line-height:1.4; }
  .entry b { font-size:12px; margin-right:6px; color:var(--muted); }
  .entry.good { background:color-mix(in srgb, var(--good) 18%, var(--card)); }
  .entry.bad { background:color-mix(in srgb, var(--bad) 18%, var(--card)); }
  .entry.money { background:color-mix(in srgb, var(--good) 16%, var(--card)); }
  .entry.crime { background:color-mix(in srgb, var(--warn) 20%, var(--card)); }
  .entry.friend { box-shadow:inset 3px 0 0 var(--accent); }
  .stat { margin:6px 0; }
  .stat-top { display:flex; justify-content:space-between; font-size:13px; font-weight:700; }
  .track { height:8px; border-radius:99px; background:color-mix(in srgb, var(--line) 80%, transparent); overflow:hidden; }
  .fill { height:100%; border-radius:99px; transition:width .45s ease; }
  .who { display:flex; gap:10px; align-items:center; }
  .avatar { width:64px; height:64px; border-radius:50%; background:color-mix(in srgb, var(--accent) 16%, var(--card)); display:grid; place-items:center; position:relative; flex:0 0 auto; }
  .avatar span.emo { position:absolute; right:-4px; bottom:-4px; font-size:18px; }
  .moneyline { font-weight:800; font-size:20px; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .pill { font-size:12px; font-weight:700; padding:4px 8px; border-radius:999px; background:color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:space-around; align-items:flex-end; gap:4px; padding:8px 10px calc(12px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--card) 92%, transparent); border-top:1px solid var(--line); backdrop-filter:blur(16px); }
  .dock button.tab { background:transparent; border:0; color:var(--muted); font-weight:700; font-size:12px; min-width:68px; }
  .dock button.tab.on { color:var(--accent); }
  .fab { width:78px; height:78px; margin-top:-36px; border-radius:50%; border:0; color:#fff; font-weight:800; background:radial-gradient(circle at 30% 30%, var(--fab2), var(--fab1)); box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 45%, transparent); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; }
  .fab small { font-weight:700; opacity:.9; }
  .fab.wait { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(.96); filter:saturate(.7); } }
  .modal-back { position:fixed; inset:0; z-index:40; background:rgba(5,8,16,.55); display:grid; place-items:center; padding:16px; }
  .modal { width:min(520px, 100%); background:var(--card); color:var(--ink); border-radius:24px; padding:18px; border:1px solid var(--line); box-shadow:var(--shadow); animation:pop .2s ease; }
  @keyframes pop { from { transform:translateY(8px) scale(.98); opacity:.4; } }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .choices button, .stack button { text-align:left; }
  .code { font-family:Poppins, sans-serif; letter-spacing:.28em; font-size:clamp(36px, 8vw, 68px); margin:8px 0; }
  #toasts { position:fixed; top:12px; right:12px; z-index:80; display:flex; flex-direction:column; gap:8px; max-width:min(360px, calc(100% - 24px)); }
  .toast { background:var(--ink); color:var(--bg); padding:10px 12px; border-radius:14px; box-shadow:var(--shadow); animation:pop .2s ease; }
  .confetti { position:fixed; top:-12px; width:8px; height:14px; z-index:70; pointer-events:none; animation:fall 1.7s linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(var(--r)); opacity:.15; } }
  html.alarm::after { content:""; position:fixed; inset:0; z-index:65; pointer-events:none; animation:strobe .35s linear 6; }
  @keyframes strobe { 0%,100% { background:rgba(226,75,91,.38);} 50% { background:rgba(55,110,255,.38);} }
  .tomb { max-width:440px; margin:18px auto; background:linear-gradient(#ded8cc, #b9b3a6); color:#2c2926; border-radius:90px 90px 16px 16px; padding:28px 20px 20px; text-align:center; box-shadow:inset 0 -10px 0 rgba(0,0,0,.08), var(--shadow); }
  .ribbon { display:inline-block; margin:4px; padding:4px 8px; border-radius:999px; background:#2c2926; color:#f4efe6; font-size:12px; font-weight:700; }
  .swatch { width:28px; height:28px; border-radius:50%; border:2px solid #fff; }
  .swatch.on { outline:3px solid var(--accent); }
  .field { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; text-align:left; }
  .field input, .field select { border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 12px; }
  .split { display:grid; grid-template-columns:1.1fr .9fr; gap:14px; }
  .bars { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin-top:8px; }
  html[data-layout="desktop"] .stage, html[data-layout="auto"] .stage { grid-template-columns:minmax(260px, 320px) minmax(0,1fr) minmax(260px, 320px); }
  html[data-layout="tablet"] .stage { grid-template-columns:minmax(240px, 300px) minmax(0,1fr); }
  html[data-layout="tablet"] .col-friend { grid-column:1 / -1; }
  html[data-layout="mobile"] .stage { grid-template-columns:1fr; }
  html[data-layout="mobile"] .col-friend, html[data-layout="mobile"] .col-main { display:none; }
  html[data-layout="mobile"][data-panel="open"] .col-timeline { display:none; }
  html[data-layout="mobile"][data-panel="open"] .col-main { display:block; }
  html[data-layout="mobile"] .bars { grid-template-columns:1fr 1fr; }
  @media (max-width: 799px) {
    html[data-layout="auto"] .stage { grid-template-columns:1fr; }
    html[data-layout="auto"] .col-friend, html[data-layout="auto"] .col-main { display:none; }
    html[data-layout="auto"][data-panel="open"] .col-timeline { display:none; }
    html[data-layout="auto"][data-panel="open"] .col-main { display:block; }
    html[data-layout="auto"] .bars { grid-template-columns:1fr 1fr; }
    .split { grid-template-columns:1fr; }
  }
  @media (min-width: 800px) and (max-width: 1099px) {
    html[data-layout="auto"] .stage { grid-template-columns:minmax(230px, 280px) minmax(0,1fr); }
    html[data-layout="auto"] .col-friend { grid-column:1 / -1; }
  }
  @media (min-width: 1100px) {
    html[data-layout="auto"] .stage { grid-template-columns:minmax(260px, 330px) minmax(0,1fr) minmax(260px, 320px); }
  }
  .hand { font-size:28px; letter-spacing:4px; }
  .hint { font-size:13px; color:var(--muted); line-height:1.45; }
</style>

function applyFx(p, fx) {
  if (!fx) return;
  if (fx.money) p.money += fx.money;
  for (const k of ['happiness','health','smarts','looks','karma']) if (fx[k]) p[k] += fx[k];
  if (fx.heat) p.heat += fx.heat;
  if (fx.disease) addDisease(p, fx.disease);
  clampVitals(p);
}
function ch(t, log, apply, kind) { return { t, log, apply, kind: kind || 'info' }; }
function s(fx, kind) { return (p) => applyFx(p, fx); }

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = localStorage.getItem('vd-mute') === '1';
    this.volume = Number(localStorage.getItem('vd-vol') ?? '0.32');
  }
  ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  bus() {
    const ctx = this.ensure();
    const g = ctx.createGain();
    g.gain.value = this.muted ? 0 : this.volume;
    g.connect(ctx.destination);
    return { ctx, g };
  }
  tone(freq, dur, type, gain, delay, slide) {
    const { ctx, g } = this.bus();
    const t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator();
    const gg = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    gg.gain.setValueAtTime(0.0001, t);
    gg.gain.exponentialRampToValueAtTime(gain, t + 0.015);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gg); gg.connect(g);
    o.start(t); o.stop(t + dur + 0.02);
  }
  noise(dur, gain, delay, freq) {
    const { ctx, g } = this.bus();
    const t = ctx.currentTime + (delay || 0);
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq || 240;
    const gg = ctx.createGain();
    gg.gain.value = gain;
    src.connect(filter); filter.connect(gg); gg.connect(g);
    src.start(t); src.stop(t + dur);
  }
  click() { this.tone(540, 0.06, 'sine', 0.12); this.tone(820, 0.05, 'triangle', 0.06, 0.02); }
  age() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.1, i * 0.07)); }
  cash() { this.tone(1760, 0.08, 'square', 0.05); this.tone(2340, 0.12, 'square', 0.04, 0.09); }
  siren() {
    const { ctx, g } = this.bus();
    const o = ctx.createOscillator();
    const gg = ctx.createGain();
    o.type = 'sawtooth';
    const t = ctx.currentTime;
    for (let i = 0; i < 8; i++) o.frequency.setValueAtTime(i % 2 ? 640 : 920, t + i * 0.16);
    gg.gain.setValueAtTime(0.05, t);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + 1.25);
    o.connect(gg); gg.connect(g);
    o.start(t); o.stop(t + 1.3);
  }
  gavel() { this.noise(0.08, 0.35, 0, 160); this.tone(130, 0.12, 'sine', 0.28); }
  success() { [523, 659, 784].forEach(f => this.tone(f, 0.4, 'triangle', 0.08)); }
  fail() { this.tone(210, 0.32, 'sawtooth', 0.07, 0, -120); }
  death() {
    this.tone(180, 0.7, 'sine', 0.18, 0, -70);
    this.tone(90, 1.1, 'triangle', 0.12, 0.15);
    [0.45, 0.8, 1.25, 1.85].forEach((d, i) => this.tone(68, 0.12, 'sine', 0.16 - i * 0.03, d));
  }
}

function blankMp() { return { on:false, isHost:false, code:'', status:'', peer:null, conn:null, greeted:false }; }
function uid() { return Math.random().toString(36).slice(2, 9); }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function rand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n) {
  const v = Math.round(Number(n) || 0);
  return (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('pt-BR');
}
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  const fx = document.getElementById('fx');

function clampVitals(p) {
  for (const k of ['happiness','smarts','looks','karma']) p[k] = clamp(Math.round(p[k]), 0, 100);
  p.health = clamp(Math.round(p.health), 0, 100);
  p.heat = clamp(Math.round(p.heat || 0), 0, 100);
}
function addDisease(p, id) {
  if (p.conditions.some(c => c.id === id) || p.conditions.length >= 3) return;
  const d = DISEASES.find(x => x.id === id);
  if (d) p.conditions.push({ id:d.id, name:d.name });
}
function netWorth(p = G.player) {
  if (!p) return 0;
  let n = p.money + p.savings;
  n += p.properties.reduce((a, x) => a + x.value, 0);
  n += p.vehicles.reduce((a, x) => a + x.value * (x.stolen ? 0.4 : 0.72), 0);
  n += p.islands.reduce((a, x) => a + x.value, 0);
  n += p.items.reduce((a, x) => a + x.price * 0.8, 0);
  for (const [id, h] of Object.entries(p.stocks)) {
    const s = G.market.find(x => x.id === id);
    if (s) n += h.shares * s.price;
  }
  if (p.loan) n -= p.loan.principal;
  return Math.round(n);
}
function pub(p) {
  return {
    first:p.first, last:p.last, age:p.age, gender:p.gender, city:p.city, countryId:p.countryId,
    money:p.money, savings:p.savings, debt:p.loan ? p.loan.principal : 0,
    happiness:p.happiness, health:p.health, smarts:p.smarts, looks:p.looks, karma:p.karma,
    job: p.job ? { title:p.job.title, salary:annualPay(p), level:p.job.level, emoji:p.job.emoji } : null,
    prison: p.inPrison ? p.sentence : 0,
    alive:p.alive, ghost:!!p.ghost, net:netWorth(p), talent:p.talent,
    skin:p.skin, hair:p.hair, crimes:p.crimes,
    vehicles: p.vehicles.map(v => ({ id:v.id, name:v.name, emoji:v.emoji })),
    married: p.relations.some(r => r.role === 'spouse' && r.alive)
  };
}
function stageEmoji(p) {
  if (!p || p.ghost || p.alive === false) return '👻';
  if (p.age < 3) return '👶';
  if (p.age < 13) return p.gender === 'f' ? '👧' : p.gender === 'm' ? '👦' : '🧒';
  if (p.age < 60) return p.gender === 'f' ? '👩' : p.gender === 'm' ? '👨' : '🧑';
  return p.gender === 'f' ? '👵' : p.gender === 'm' ? '👴' : '🧓';
}

  const hair = ['#1c1c1c','#6b3e1e','#e0b354','#8d2f39','#245c43','#d5d5d5'][p.hair % 6];
  const old = (p.age || 0) > 64;
  const baby = (p.age || 0) < 4;
  const eye = baby ? 4.2 : 3.2;
  return `<svg viewBox="0 0 80 80" width="${size||64}" height="${size||64}" aria-hidden="true">
    <circle cx="40" cy="40" r="38" fill="${skin}"/>
    <path d="M12 38 Q40 ${baby?6:14} 68 38 Q66 16 40 12 Q14 16 12 38" fill="${hair}"/>
    <circle cx="30" cy="42" r="${eye}" fill="#1b1b1b"/>
    <circle cx="50" cy="42" r="${eye}" fill="#1b1b1b"/>
    ${old ? '<path d="M24 34 h12 M44 34 h12" stroke="#7a5a48" stroke-width="1"/>' : ''}
    <path d="M32 56 Q40 62 48 56" stroke="#7a3b3b" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function priceOf(base) { return Math.round(base * country().col); }
function qualifies(p, c) {
  if (!p.alive || p.ghost || p.inPrison) return false;
  if (p.age < (c.minAge || 0)) return false;
  if (c.maxAge && p.age > c.maxAge) return false;
  if (c.smarts && p.smarts < c.smarts) return false;
  if (c.looks && p.looks < c.looks) return false;
  if (c.health && p.health < c.health) return false;
  if (c.karmaMax != null && p.karma > c.karmaMax) return false;
  if (c.degree === true && !p.edu.degree) return false;
  if (typeof c.degree === 'string' && p.edu.degree !== c.degree) return false;
  if (c.degreeAny && !c.degreeAny.includes(p.edu.degree)) return false;
  if (c.boss && !(p.edu.degree || p.money > 250000 || p.peak > 250000)) return false;
  return true;
}
function hire(p, id) {
  const c = CAREERS.find(x => x.id === id);
  if (!c || !qualifies(p, c) || p.job) return false;
  p.job = { id:c.id, title:c.title, emoji:c.emoji, base:c.base, level:1, perf:62, years:0, raised:false };
  return true;
}
function annualPay(p = G.player) {
  if (!p?.job || p.inPrison) return 0;
  const ctry = COUNTRIES.find(c => c.id === p.countryId) || COUNTRIES[0];
  let sal = p.job.base * (1 + (p.job.level - 1) * 0.16);
  if (p.talent === 'tech' && (p.job.id === 'gamedev' || p.job.id === 'streamer')) sal *= 1.18;
  if (p.talent === 'sports' && p.job.id === 'soccer') sal *= 1.25;
  if (p.talent === 'music' && (p.job.id === 'actor' || p.job.id === 'streamer')) sal *= 1.16;
  if (p.talent === 'crime' && p.job.id === 'mafia') sal *= 1.28;
  if (p.talent === 'finance' && p.job.id === 'ceo') sal *= 1.15;
  sal *= ctry.sal;
  return Math.round(sal * (1 - ctry.tax));
}
function spouseOf(p = G.player) { return p.relations.find(r => r.role === 'spouse' && r.alive); }
function findRel(id) { return G.player.relations.find(r => r.id === id); }
function spendAction() {
  if (G.player.actions >= 6) { toast('Você já gastou a energia deste ano.'); return false; }
  G.player.actions++;
  return true;
}
function assertLiving() {
  if (!G.player?.alive) { toast('Esta vida já acabou.'); return false; }
  if (G.player.ghost) { toast('Fantasmas não fazem isso. Assombre ou dê sorte.'); return false; }
  return true;
}
function syncFriendRelation() {
  if (!G.player || !G.friend) return;
  let r = G.player.relations.find(x => x.isPlayer);
  const name = (G.friend.first || 'Amigo') + ' ' + (G.friend.last || '');
  if (!r) {
    G.player.relations.unshift({ id:'duo', isPlayer:true, role: G.player.marriedToPlayer ? 'spouse' : 'friend', name, gender:G.friend.gender || 'x', age:G.friend.age || 0, bond:50, alive:!!G.friend.alive });
  } else {
    r.name = name;
    r.age = G.friend.age || r.age;
    r.gender = G.friend.gender || r.gender;
    r.alive = !!G.friend.alive && !G.friend.ghost;
  }
}
function changed() {
  if (G.player && G.player.alive) {
    const n = netWorth();
    const prev = G.player.peak || 0;
    if (prev < 1000000 && n >= 1000000) {
      confetti(); SFX.success();
      pushLog('Sua fortuna passou de um milhão.', 'money');
      if (G.mp.on) send({ t:'feed', text:'🏝️ Seu amigo ficou milionário!', kind:'money' });
    }
    if (n > G.player.peak) G.player.peak = n;
  }
  render();
  if (G.mp.on && G.player) send({ t:'snap', p: pub(G.player) });
}
function narrate(selfText, friendText, kind) {
  pushLog(selfText, kind || 'info');
  if (friendText && G.mp.on) send({ t:'feed', text: friendText, kind: kind || 'info' });
  changed();
}
function rollMarket() {
  G.marketEpoch++;
  const rng = mulberry32(hash((G.room || 'SOLO') + ':' + G.marketEpoch));
  for (const s of G.market) {
    s.prev = s.price;
    const vol = s.risk === 'low' ? 0.08 : s.risk === 'med' ? 0.18 : 0.42;
    s.price = Math.max(0.2, +(s.price * (1 + (rng() * 2 - 1) * vol)).toFixed(2));
  }
  return { epoch:G.marketEpoch, prices:G.market.map(s => ({ id:s.id, price:s.price, prev:s.prev })) };
}
function applyPrices(pack) {
  if (!pack || pack.epoch <= G.marketEpoch) return false;
  G.marketEpoch = pack.epoch;
  for (const row of pack.prices) {
    const s = G.market.find(x => x.id === row.id);
    if (s) { s.prev = row.prev; s.price = row.price; }
  }
  return true;
}
function sharedEventFor(age, otherAge) {
  if (!G.mp.on || otherAge == null || Math.abs(age - otherAge) > 5) return null;
  const pool = EVENTS.filter(e => e.shared && age >= e.min && age <= e.max);
  if (!pool.length) return null;
  const rng = mulberry32(hash(G.room + ':share:' + G.marketEpoch + ':' + age));
  return pool[Math.floor(rng() * pool.length)].id;
}

  return {

function makePerson(role, gender, age, extra) {
  return Object.assign({ id:uid(), role, gender, age, name: pick(FIRST[gender] || FIRST.x), bond: role === 'parent' ? 75 : role === 'sibling' ? 55 : 40, alive:true }, extra || {});

function createLife(startAge) {
  const d = G.draft;
  const gender = d.gender;
  const p = {
    first: d.first.trim().slice(0, 18) || 'Sem Nome',
    last: d.last.trim().slice(0, 18) || 'Anônimo',
    gender, countryId: d.countryId, city: d.city,
    skin: d.skin, hair: d.hair, talent: d.talent,
    age: startAge, money: startAge >= 18 ? Math.round(8000 * (COUNTRIES.find(c=>c.id===d.countryId)?.sal || 1)) : 0,
    savings: 0, loan: null,
    happiness: rand(62, 82), health: rand(74, 92), smarts: rand(38, 68), looks: rand(40, 75), karma: rand(52, 74),
    heat: 0, crimes: 0, sentence: 0, inPrison: false, conditions: [],
    edu: { stage:'none', major:null, year:0, degree:null, club:null },
    job: null, relations: [], properties: [], vehicles: [], islands: [], items: [], stocks: {},
    company: null, heir: null, marriedToPlayer: false, prenup: false,
    ghost: false, alive: true, peak: 0, actions: 0, haunts: 0, lastHauntAge: -1, promotions: 0
  };
  if (p.talent === 'crime') p.karma -= 8;
  if (p.talent === 'finance') p.smarts += 8;
  if (p.talent === 'sports') p.health += 8;
  if (p.talent === 'music') p.happiness += 6;
  if (p.talent === 'tech') p.smarts += 8;
  if (startAge >= 18) p.edu.stage = 'hs';
  else if (startAge >= 12) p.edu.stage = 'high';
  else if (startAge >= 6) p.edu.stage = 'primary';
  const mom = makePerson('parent', 'f', rand(26, 38) + startAge);
  const dad = makePerson('parent', 'm', mom.age + rand(-2, 4));
  p.relations.push(mom, dad);
  const sibs = rand(0, 2);
  for (let i = 0; i < sibs; i++) {
    const g = pick(['m','f']);
    p.relations.push(makePerson('sibling', g, Math.max(0, startAge + rand(-6, 6))));
  }
  if (Math.random() < 0.35) {
    const pet = pick(PETS.filter(x => x.cost < 2000));
    p.relations.push({ id:uid(), role:'pet', name:pet.name, emoji:pet.emoji, gender:'x', age:rand(1,4), bond:70, alive:true, upkeep:pet.upkeep, joy:pet.joy, life:pet.life });
  }
  clampVitals(p);
  G.player = p;
  G.log = [];
  G.afterlife = false;
  G.epitaph = null;
  G.modal = null;
  G.modalQueue = [];
  G.ready = { me:false, pal:false };
  freshMarket();
  p.peak = 0;
  syncFriendRelation();
  pushLog(startAge === 0 ? `Você nasceu em ${p.city}, ${country().name}.` : `Sua vida começa aos 18 em ${p.city}, ${country().name}.`, 'good');
  pushLog(`Talento: ${TALENTS.find(t=>t.id===p.talent).name}. Família: ${mom.name} e ${dad.name}.`, 'info');
  G.screen = 'play';
  G.player.peak = netWorth();
  changed();
  const pending = G.inbox.splice(0);
  pending.forEach(onData);
}

function progressEducation(p) {
  if (p.age === 6 && p.edu.stage === 'none') { p.edu.stage = 'primary'; pushLog('Você entrou na escola primária.', 'good'); }
  if (p.age === 12 && p.edu.stage === 'primary') { p.edu.stage = 'high'; pushLog('O ensino médio começou.', 'info'); }
  if (p.age === 18 && (p.edu.stage === 'high' || p.edu.stage === 'primary')) { p.edu.stage = 'hs'; pushLog('Você concluiu a escola.', 'good'); SFX.success(); }
  if (p.edu.stage === 'uni') {
    const major = MAJORS.find(m => m.id === p.edu.major);
    const fee = Math.round(major.tuition * country().col);
    if (p.money < fee) {
      p.edu.stage = 'hs';
      pushLog('A mensalidade venceu você. A faculdade ficou para trás.', 'bad');
      SFX.fail();
    } else {
      p.money -= fee;
      p.edu.year++;
      p.smarts += 3;
      pushLog(`Ano ${p.edu.year} de ${major.name}. Mensalidade de ${money(fee)}.`, 'info');
      if (p.edu.year >= 4) {
        p.edu.stage = 'grad';
        p.edu.degree = major.id;
        pushLog('Formatura em ' + major.name + '!', 'good');
        SFX.success(); confetti();
      }
    }
  }
}
function earn(p) {
  if (p.job && !p.inPrison) {
    p.job.years++;
    const drift = rand(-8, 14) + Math.round((p.smarts - 50) / 12);
    p.job.perf = clamp(p.job.perf + drift, 0, 100);
    const pay = annualPay(p);
    p.money += pay;
    pushLog(`${p.job.emoji} Salário de ${p.job.title}: ${money(pay)}.`, 'money');
    if (p.job.perf >= 88 && p.job.level < 8 && Math.random() < 0.55) {
      p.job.level++;
      p.job.base = Math.round(p.job.base * 1.12);
      p.job.perf = 70;
      p.promotions++;
      pushLog(`Promoção! ${p.job.title} agora é nível ${p.job.level}.`, 'good');
      SFX.success(); confetti();
      if (G.mp.on) send({ t:'feed', text:`🎉 Seu amigo foi promovido a ${p.job.title} (nível ${p.job.level}).`, kind:'good' });
    } else if (p.job.perf < 22 && Math.random() < 0.45) {
      pushLog(`Você foi demitido de ${p.job.title}.`, 'bad');
      p.job = null;
      SFX.fail();
    }
  }
  for (const prop of p.properties) if (prop.rented) {
    p.money += prop.rent;
    pushLog(`${prop.emoji} Aluguel de ${prop.name}: ${money(prop.rent)}.`, 'money');
  }
  for (const isle of p.islands) if (isle.mode === 'resort') {
    const income = Math.round(isle.value * 0.07);
    const upkeep = Math.round(isle.value * 0.02);
    p.money += income - upkeep;
    pushLog(`${isle.emoji} Resort rendeu ${money(income - upkeep)} líquidos.`, 'money');
  }
  if (p.company) {
    const rate = 0.08 + (p.talent === 'finance' ? 0.03 : 0) + (p.smarts - 50) / 500;
    const gain = Math.round(p.company.invested * rate);
    p.money += gain;
    pushLog(`A sociedade ${p.company.name} pagou ${money(gain)}.`, 'money');
  }
  for (const [id, h] of Object.entries(p.stocks)) {
    const s = G.market.find(x => x.id === id);
    if (s && s.risk === 'low') p.money += Math.round(h.shares * s.price * 0.012);
  }
}
function spendLife(p) {
  const rate = 0.04 + (p.talent === 'finance' ? 0.02 : 0);
  if (p.savings > 0) {
    const before = p.savings;
    p.savings = Math.round(p.savings * (1 + rate));
    pushLog(`Poupança rendeu ${money(p.savings - before)}.`, 'money');
  }
  for (const r of p.relations) if (r.role === 'pet' && r.alive) {
    p.money -= r.upkeep;
    p.happiness += Math.ceil(r.joy / 2);
  }
  if (p.loan) {
    const pay = Math.max(500, Math.round(p.loan.principal * 0.18));
    if (p.money >= pay) {
      p.money -= pay;
      p.loan.principal = Math.round(p.loan.principal * 0.86);
      p.loan.missed = 0;
      pushLog(`Parcela do empréstimo: ${money(pay)}. Restam ${money(p.loan.principal)}.`, 'money');
      if (p.loan.principal < 400) { p.loan = null; pushLog('O banco deu baixa. Você quitou a dívida.', 'good'); }
    } else {
      p.loan.missed++;
      pushLog('Você não pagou o banco neste ano.', 'bad');
      if (p.loan.missed >= 2 && p.properties.length) {
        const seized = p.properties.pop();
        p.loan.missed = 0;
        p.loan.principal = Math.round(p.loan.principal * 0.55);
        pushLog(`O banco tomou ${seized.name}.`, 'bad');
        SFX.fail();
      }
    }
  }
  for (const c of [...p.conditions]) {
    const d = DISEASES.find(x => x.id === c.id);
    if (!d) continue;
    p.health -= d.dmg;
    if (d.happy) p.happiness += d.happy;
  }
  if (p.age > 58) p.health -= Math.round((p.age - 58) / 7);
  if (p.age > 78) p.health -= 2;
  if (p.age > 10 && p.conditions.length < 2 && Math.random() < 0.08 + Math.max(0, p.age - 50) / 400) addDisease(p, pick(DISEASES).id);
  p.heat = clamp(p.heat - 8, 0, 100);
}
function ageRelations(p) {
  for (const r of p.relations) {
    if (!r.alive || r.isPlayer) continue;
    r.age = (r.age || 0) + 1;
    if (r.role === 'pet') {
      if (r.age > r.life) { r.alive = false; p.happiness -= 12; pushLog(`${r.emoji || '🐾'} ${r.name} chegou ao fim da vida.`, 'bad'); }
      continue;
    }
    if ((r.role === 'friend' || r.role === 'crush') && Math.random() < 0.35) r.bond = clamp(r.bond - 2, 0, 100);
    const limit = r.role === 'parent' ? 86 : r.role === 'spouse' ? 92 : 100;
    if (r.age > limit && Math.random() < (r.age - limit + 2) * 0.08) {
      r.alive = false;
      const close = r.role === 'parent' || r.role === 'spouse' || r.role === 'child';
      p.happiness -= close ? 16 : 6;
      p.health -= close ? 4 : 0;
      pushLog(`${r.name} faleceu.`, 'bad');
    }
  }
}
function eventOk(p, e) {
  if (p.age < e.min || p.age > e.max) return false;
  if (e.need === 'job' && !p.job) return false;
  if (e.need === 'school' && !['primary','high'].includes(p.edu.stage)) return false;
  return true;
}
function maybeEvent(p, forced) {
  let ev = forced && EVENTS.find(e => e.id === forced && eventOk(p, e));
  const shared = !!ev;
  if (!ev && Math.random() < 0.82) {
    const pool = EVENTS.filter(e => eventOk(p, e));
    if (pool.length) ev = pick(pool);
  }
  if (ev) pushModal({ type:'event', eventId: ev.id, shared });
}
function progressPrison(p) {
  if (!p.inPrison) return;
  p.sentence--;
  if (p.sentence <= 0) {
    p.inPrison = false;
    p.sentence = 0;
    pushLog('Os portões abriram. Você está livre.', 'good');
    SFX.success();
  } else {
    pushLog(`Mais um ano na cadeia. Faltam ${p.sentence}.`, 'crime');
    pushModal({ type:'prison' });
  }
}
function die(cause) {
  const p = G.player;
  if (!p || !p.alive) return;
  p.alive = false;
  p.health = 0;
  p.deathCause = cause;
  G.epitaph = buildEpitaph();
  G.modal = null;
  G.modalQueue = [];
  SFX.death();
  pushLog('Sua vida terminou: ' + cause + '.', 'bad');
  if (G.mp.on) send({ t:'feed', text:`💀 Seu amigo morreu aos ${p.age} anos (${cause}).`, kind:'bad' });
  if (G.mp.on) { G.afterlife = true; G.modal = { type:'afterlife' }; G.screen = 'play'; }
  else { G.afterlife = false; G.screen = 'grave'; }
  changed();
}
function stepYear(forced) {
  const p = G.player;
  if (!p || !p.alive || p.ghost) return;
  p.age++;
  p.actions = 0;
  if (p.job) p.job.raised = false;
  SFX.age();
  progressEducation(p);
  progressPrison(p);
  if (!p.inPrison) earn(p);
  spendLife(p);
  ageRelations(p);
  clampVitals(p);
  pushLog(`Você fez ${p.age} anos em ${p.city}.`, 'info');
  if (p.health <= 0 || p.age >= 104 || (p.age > 87 && p.health < 32 && Math.random() < (p.age - 85) * 0.04)) {
    die(p.health <= 0 ? 'a saúde chegou ao fim' : 'idade avançada');
    return;
  }
  if (!G.modal) maybeEvent(p, forced);
  changed();
}
function ribbons(p) {
  const list = [];
  if ((p.peak || 0) >= 1000000) list.push('Milionário');
  if (p.properties.length >= 3 || p.properties.some(x => x.value >= 3000000)) list.push('Magnata imobiliário');
  if (p.islands.length) list.push('Dono de ilha');
  if (p.crimes >= 5) list.push('Mente criminosa');
  if (p.karma >= 75 && p.crimes === 0) list.push('Cidadão modelo');
  if (p.relations.filter(r => r.role === 'child').length >= 3) list.push('Família numerosa');
  if ((p.promotions || 0) >= 3) list.push('Topo da carreira');
  if (p.ghost) list.push('Além da vida');
  if ((p.peak || 0) < 1500 && p.age > 40) list.push('Azarado');
  if (!list.length) list.push('Uma vida inteira');
  return list;
}
function buildEpitaph() {
  const p = G.player;
  return {
    name: p.first + ' ' + p.last, age: p.age, cause: p.deathCause, net: netWorth(p),
    crimes: p.crimes, kids: p.relations.filter(r => r.role === 'child').length,
    city: p.city, ribbons: ribbons(p), job: p.job ? p.job.title : 'sem profissão no fim'
  };
}
function jailRisk(years, reason) {
  flash(); SFX.siren();
  pushModal({ type:'lawyer', years, reason: reason || 'o que você fez' });
  if (G.mp.on) send({ t:'feed', text:'🚨 Seu amigo se meteu com a polícia.', kind:'crime' });
  changed();
}
function convict(years) {
  const p = G.player;
  p.inPrison = true;
  p.sentence = years;
  p.job = null;
  p.heat = 70;
  narrate(`A sentença saiu: ${years} ano(s) de prisão.`, `🚓 Seu amigo foi preso por ${years} ano(s).`, 'crime');
}
function tryCrime(def) {
  if (!assertLiving()) return;
  const p = G.player;
  if (p.inPrison) return toast('Você já está preso.');
  if (p.age < def.minAge) return toast('Cedo demais para esse golpe.');
  if (!spendAction()) return;
  let chance = def.chance;
  if (p.talent === 'crime') chance += 0.12;
  if (p.talent === 'tech' && def.tech) chance += 0.12;
  if (p.islands.some(i => i.mode === 'hideout')) chance += 0.08;
  chance += (40 - p.karma) / 500 - p.heat / 240 + p.smarts / 700;
  chance = clamp(chance, 0.05, 0.9);
  if (Math.random() < chance) {
    const loot = Math.round(rand(def.min, def.max) * (0.65 + country().sal * 0.45));
    p.money += loot;
    p.karma = clamp(p.karma - def.karma, 0, 100);
    p.heat = clamp(p.heat + def.heat, 0, 100);
    p.crimes++;
    p.happiness = clamp(p.happiness + 3, 0, 100);
    SFX.cash();
    narrate(`${def.emoji} ${def.win}: ${money(loot)}.`, `${def.feed}: ${money(loot)}.`, 'crime');
  } else {
    p.heat = clamp(p.heat + 22, 0, 100);
    p.karma = clamp(p.karma - 6, 0, 100);
    pushLog(def.lose, 'crime');
    jailRisk(def.years, def.name);
  }
}
function stealStreet(id) {
  if (!assertLiving()) return;
  const car = STREET.find(c => c.id === id);
  const p = G.player;
  if (p.inPrison) return toast('Você já está preso.');
  if (!spendAction()) return;
  let chance = car.chance + (p.talent === 'crime' ? 0.12 : 0) + (p.islands.some(i => i.mode === 'hideout') ? 0.06 : 0) - p.heat / 300;
  if (Math.random() < clamp(chance, 0.05, 0.9)) {
    p.vehicles.push({ uid:uid(), id:car.id, name:car.name, emoji:car.emoji, value:car.loot, stolen:true });
    p.crimes++;
    p.karma = clamp(p.karma - 8, 0, 100);

function computeHeist(seed, choices) {
  const rng = mulberry32(seed);
  const hostC = choices.host || 'split';
  const guestC = choices.guest || 'split';
  const success = rng() < 0.78;
  const loot = 90000 + Math.floor(rng() * 340000);
  if (!success) return { ok:false, jail:'both', years:5, loot:0 };
  if (hostC === 'betray' && guestC === 'betray') return { ok:false, jail:'both', years:6, loot:0, double:true };
  if (hostC === 'betray') return { ok:true, who:'host', loot, jail:'guest', years:3 };
  if (guestC === 'betray') return { ok:true, who:'guest', loot, jail:'host', years:3 };
  return { ok:true, who:'both', loot, jail:'none', years:0 };
}
function maybeResolveHeist() {

  if (!h?.active) return;
  const both = h.choices.host && h.choices.guest;
  if (!both && Date.now() < h.ends) return;
  if (G.mp.on && !G.mp.isHost) return;
  h.active = false;
  const result = computeHeist(h.seed, h.choices);
  if (G.mp.on) send({ t:'heist', op:'result', result });
  applyHeist(result);

function makeCode() {

function wire(conn) {

  if (conn.open) ready();
}

    toast('Seu amigo recusou o pedido.');
  } else if (msg.t === 'divorce') {
    const r = G.player.relations.find(x => x.isPlayer);
    if (r) { r.role = 'rival'; r.bond = 8; }
    G.player.marriedToPlayer = false;
    narrate('O casamento de vocês acabou.', null, 'bad');
  } else if (msg.t === 'social' && msg.op === 'talk') {
    const r = G.player.relations.find(x => x.isPlayer);
    if (r) r.bond = clamp(r.bond + 5, 0, 100);
    G.player.happiness = clamp(G.player.happiness + 2, 0, 100);
    narrate('Seu amigo puxou conversa.', null, 'good');
  } else if (msg.t === 'company' && msg.op === 'invite') {
    pushModal({ type:'confirm', title:'Sociedade', text:`${G.friend?.first || 'Seu amigo'} quer abrir ${msg.name} com entrada de ${money(msg.buyIn)} cada.`, yes:'company-yes', payload:{ buyIn: msg.buyIn, name: msg.name } });
    render();
  } else if (msg.t === 'company' && msg.op === 'accept') {
    if (G.player.money >= msg.buyIn && !G.player.company) {
      G.player.money -= msg.buyIn;
      G.player.company = { name: msg.name, invested: msg.buyIn };
      narrate(`A sociedade ${msg.name} está aberta.`, `🤝 Seu amigo fechou sociedade com você.`, 'good');
    }
  } else if (msg.t === 'company' && msg.op === 'no') toast('Seu amigo recusou a sociedade.');
  else if (msg.t === 'heist' && msg.op === 'invite') {
    pushModal({ type:'confirm', title:'Assalto em dupla', text:'Seu amigo chamou você para um banco. O lucro é maior. Alguém pode trair.', yes:'heist-yes', payload: msg.seed });
    render();
  } else if (msg.t === 'heist' && msg.op === 'accept') {
    G.heist = { active:true, seed: msg.seed, choices:{}, ends: Date.now()+8000 };
    pushModal({ type:'heist' });
    render();
  } else if (msg.t === 'heist' && msg.op === 'choice' && G.heist?.active) {
    G.heist.choices[msg.side] = msg.choice;
    maybeResolveHeist();
    render();
  } else if (msg.t === 'heist' && msg.op === 'result') applyHeist(msg.result);
  else if (msg.t === 'heist' && msg.op === 'no') toast('Seu amigo recusou o assalto.');
}

function roleLabel(r) {
  if (r.isPlayer && r.role === 'spouse') return 'Cônjuge jogador';
  if (r.isPlayer) return 'Jogador conectado';
  const map = { parent: r.gender==='f'?'Mãe':r.gender==='m'?'Pai':'Pai/Mãe', sibling: r.gender==='f'?'Irmã':'Irmão', friend:'Amizade', crush:'Namoro', spouse:'Cônjuge', child: r.gender==='f'?'Filha':'Filho', pet:'Pet', rival:'Rival' };
  return map[r.role] || r.role;
}
function bar(label, icon, value) {
  const v = clamp(Math.round(value || 0), 0, 100);
  const col = v >= 60 ? 'var(--good)' : v >= 30 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="stat"><div class="stat-top"><span>${icon} ${label}</span><span>${v}</span></div><div class="track"><div class="fill" style="width:${v}%;background:${col}"></div></div></div>`;
}

function cardTxt(c) { return ({1:'A',11:'J',12:'Q',13:'K'}[c.r] || c.r) + c.s; }
function handValue(hand) {
  let t = 0, aces = 0;
  for (const c of hand) { if (c.r===1) { aces++; t+=11; } else t += Math.min(c.r, 10); }
  while (t>21 && aces) { t-=10; aces--; }
  return t;
}
function freshDeck() {
  const cards = [];
  for (const s of ['♠','♥','♦','♣']) for (let r=1;r<=13;r++) cards.push({ r, s });
  for (let i=cards.length-1;i>0;i--) { const j=rand(0,i); [cards[i],cards[j]]=[cards[j],cards[i]]; }
  return cards;
}
function dealBj(bet) {
  if (!assertLiving() || G.player.inPrison) return;
  bet = bet || 500;
  if (G.player.money < bet) return toast('A ficha é maior que o bolso.');
  G.player.money -= bet;
  const deck = freshDeck();
  G.table = { bet, deck, player:[deck.pop(), deck.pop()], dealer:[deck.pop(), deck.pop()], done:false, note:'' };
  if (handValue(G.table.player)===21) settleBj('blackjack');
  else { pushModal({ type:'bj' }); changed(); }
}
function settleBj(kind) {
  const t = G.table;
  t.done = true;
  const pv = handValue(t.player);
  let dv = handValue(t.dealer);
  if (kind!=='bust' && kind!=='blackjack') while (dv<17) { t.dealer.push(t.deck.pop()); dv = handValue(t.dealer); }
  let mult = 0;
  if (kind==='blackjack') mult = 2.5;
  else if (kind==='bust' || pv>21) mult = 0;
  else if (dv>21 || pv>dv) mult = 2;
  else if (pv===dv) mult = 1;
  G.player.money += Math.round(t.bet * mult);
  t.note = mult===0 ? 'A banca ficou com a ficha.' : mult===1 ? 'Empate. A ficha voltou.' : mult===2.5 ? '21 de saída.' : 'Você levou.';
  if (mult>1) SFX.cash(); else SFX.fail();
  if (G.modal?.type!=='bj') pushModal({ type:'bj' });
  changed();
}
function spinRoulette(color) {
  if (!assertLiving() || G.player.inPrison) return;
  const bet = 500;
  if (G.player.money < bet) return toast('Sem ficha.');
  G.player.money -= bet;
  const n = rand(0, 36);
  const reds = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const landed = n===0 ? 'green' : reds.has(n) ? 'red' : 'black';
  let win = 0;
  if (landed===color) win = color==='green' ? bet*15 : bet*2;
  G.player.money += win;
  if (win) { SFX.cash(); narrate(`Roleta: ${n} ${landed}. Você ganhou ${money(win)}.`, null, 'money'); }
  else { SFX.fail(); narrate(`Roleta: ${n} ${landed}. A ficha ficou na mesa.`, null, 'bad'); }
}

  sue() { if(!G.mp.on||!assertLiving()) return; const cost=priceOf(8000); if(G.player.money<cost) return toast('Custa '+money(cost)+'.'); const win=Math.random()<0.55; const claim=rand(12000,50000); G.player.money-=cost; send({t:'sue', win, claim}); if(win){ const got=Math.min(claim, G.friend?.money||claim); G.player.money+=got; narrate('Você ganhou o processo: '+money(got)+'.', '⚖️ Seu amigo te processou.', 'money'); } else narrate('Você pagou o processo e perdeu.', '⚖️ Seu amigo te processou e perdeu.', 'bad'); },

function moveBank(frac, into) {
  const p=G.player;
  if(into){ const n=frac===1?p.money:Math.round(p.money*frac); if(n<=0) return; p.money-=n; p.savings+=n; }
  else { const n=frac===1?p.savings:Math.round(p.savings*frac); if(n<=0) return; p.savings-=n; p.money+=n; }
  changed();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (!b.dataset.quiet) { try { SFX.click(); } catch (err) {} }
  const fn = ACTIONS[act];
  if (!fn) return;
  try { fn(b.dataset); }
  catch (err) { console.error(err); toast('Algo quebrou: ' + err.message); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'f-country' || e.target.id === 'f-gender' || e.target.id === 'f-talent') {
    captureDraft();
    if (e.target.id === 'f-country') G.draft.city = (COUNTRIES.find(c=>c.id===G.draft.countryId)||COUNTRIES[0]).cities[0];
    render();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'vol') { SFX.volume = Number(e.target.value); localStorage.setItem('vd-vol', SFX.volume); }
  if (e.target.id === 'f-first' || e.target.id === 'f-last') {
    const prev = document.getElementById('name-preview');
    if (prev) prev.textContent = document.getElementById('f-first').value + ' ' + document.getElementById('f-last').value;
  }
});
setInterval(() => {
  const auc = document.getElementById('auc-left');
  if (G.auction?.active && auc) {
    const left = Math.max(0, G.auction.ends - Date.now());
    auc.textContent = Math.ceil(left/1000) + 's';
    if (left <= 0 && !G.auction.closing) {
      G.auction.closing = true;
      if (!G.mp.on || G.mp.isHost) finishAuction();
    }
  }
  const he = document.getElementById('heist-left');
  if (G.heist?.active && he) {
    he.textContent = Math.max(0, Math.ceil((G.heist.ends - Date.now())/1000)) + 's';
    maybeResolveHeist();
  }
}, 250);
function boot() {
  freshMarket();
  document.documentElement.dataset.theme = G.theme;
  document.documentElement.dataset.layout = G.layout;
  render();
}
